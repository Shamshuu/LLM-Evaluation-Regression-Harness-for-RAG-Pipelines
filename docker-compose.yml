services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rag-eval-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  evaluator:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      VECTOR_DB_HOST: qdrant
      VECTOR_DB_PORT: 6333
    command: ["python", "run_eval.py"]
    volumes:
      - .:/workspace

volumes:
  qdrant_storage:
